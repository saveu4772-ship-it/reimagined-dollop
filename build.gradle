plugins { id 'com.android.application' version '8.5.2' }

android {
    namespace 'ics.recents'
    compileSdk 34
    defaultConfig { applicationId 'ics.recents'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['.']
        res.srcDirs = ['res']
        assets.srcDirs = ['assets']
    }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82' }
